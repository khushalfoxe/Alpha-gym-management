<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Member Login - Alpha Gym</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Poppins,sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(rgba(0,0,0,0.6),rgba(0,0,0,0.6)),
    url("https://images.unsplash.com/photo-1571902943202-507ec2618e8f");
    background-size:cover;
}

.container{
    background:white;
    padding:35px;
    width:350px;
    border-radius:12px;
    text-align:center;
    box-shadow:0 5px 15px rgba(0,0,0,0.3);
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border-radius:8px;
    border:1px solid #ccc;
}

button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:8px;
    background:black;
    color:white;
    font-size:15px;
    cursor:pointer;
}

button:hover{
    background:#e63946;
}

.joinBtn{
    background:gray;
}

.error{
    color:red;
    font-size:13px;
    min-height:18px;
}

.loading{
    display:none;
    font-size:14px;
}

/* Popup */
.popup{
    display:none;
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 5px 20px rgba(0,0,0,0.4);
    text-align:center;
    width:300px;
}

.popup button{
    background:black;
    margin-top:15px;
}
</style>
</head>

<body>

<div class="container">

<h2>Member Login</h2>

<input type="email" id="email" placeholder="Email">
<input type="password" id="password" placeholder="Password">

<div class="error" id="error"></div>
<div class="loading" id="loading">⏳ Logging in...</div>

<button onclick="login()">Login</button>

<button class="joinBtn" onclick="openPopup()">Join Gym</button>

</div>

<!-- JOIN POPUP -->
<div class="popup" id="popup">
<h3>Join Alpha Gym 💪</h3>
<p>To join the gym, contact us:</p>

<p><b>📞 Phone:</b> +91 9876543210</p>
<p><b>📧 Email:</b> alphagym@gmail.com</p>
<p>Visit the gym to complete registration.</p>

<button onclick="closePopup()">Close</button>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

// Firebase Config
const firebaseConfig = {
  apiKey: "AIzaSyAyG9FN8z6XNEXaNIzyO_iPdc8IZUCDENw",
  authDomain: "alpha-4d34a.firebaseapp.com",
  projectId: "alpha-4d34a",
  storageBucket: "alpha-4d34a.firebasestorage.app",
  messagingSenderId: "375125986516",
  appId: "1:375125986516:web:0c9f70b6ede9c1f0b9bf41"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// LOGIN
window.login = async function(){

    const email=document.getElementById("email").value.trim();
    const password=document.getElementById("password").value.trim();
    const error=document.getElementById("error");
    const loading=document.getElementById("loading");

    error.innerText="";

    if(!email || !password){
        error.innerText="All fields required";
        return;
    }

    try{
        loading.style.display="block";

        await signInWithEmailAndPassword(auth,email,password);

        // Redirect to user page
        window.location.href="user.html";

    }catch(err){
        error.innerText="Invalid credentials";
    }

    loading.style.display="none";
}

// POPUP
window.openPopup=function(){
    document.getElementById("popup").style.display="block";
}

window.closePopup=function(){
    document.getElementById("popup").style.display="none";
}

</script>

</body>
</html>
