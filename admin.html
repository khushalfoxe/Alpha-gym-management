<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login - Alpha Gym</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Poppins, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
               url("https://images.unsplash.com/photo-1558611848-73f7eb4001ab");
    background-size:cover;
}

.container{
    background:white;
    padding:40px;
    width:350px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,0.3);
    text-align:center;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border-radius:8px;
    border:1px solid #ccc;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:black;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#e63946;
}

.error{
    color:red;
    font-size:13px;
    min-height:18px;
}

.spinner{
    display:none;
    margin-top:10px;
    color:#333;
}

.footer{
    font-size:12px;
    color:gray;
    margin-top:20px;
}
</style>
</head>

<body>

<div class="container">
    <h2>Admin Login</h2>
    <p>Alpha Gym Management</p>

    <input type="email" id="email" placeholder="Admin Email">
    <input type="password" id="password" placeholder="Password">

    <div class="error" id="error"></div>

    <button onclick="login()">Login</button>

    <div class="spinner" id="spinner">Logging in...</div>

    <p class="footer">Authorized admins only</p>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-analytics.js";

// 🔥 YOUR FIREBASE CONFIG CONNECTED
const firebaseConfig = {
  apiKey: "AIzaSyAyG9FN8z6XNEXaNIzyO_iPdc8IZUCDENw",
  authDomain: "alpha-4d34a.firebaseapp.com",
  projectId: "alpha-4d34a",
  storageBucket: "alpha-4d34a.firebasestorage.app",
  messagingSenderId: "375125986516",
  appId: "1:375125986516:web:0c9f70b6ede9c1f0b9bf41",
  measurementId: "G-BL31D31DZ2"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
getAnalytics(app);
const auth = getAuth(app);

window.login = async function(){

    const email=document.getElementById("email").value.trim();
    const password=document.getElementById("password").value.trim();
    const errorDiv=document.getElementById("error");
    const spinner=document.getElementById("spinner");

    errorDiv.innerText="";

    // ✅ Validation
    if(!email || !password){
        errorDiv.innerText="All fields required";
        return;
    }

    if(password.length<6){
        errorDiv.innerText="Password must be at least 6 characters";
        return;
    }

    try{
        spinner.style.display="block";

        await signInWithEmailAndPassword(auth,email,password);

        alert("Login Successful ✅");

        // 🔁 Redirect after login
        window.location.href="dashboard.html";

    }catch(err){
        errorDiv.innerText=err.message;
    }

    spinner.style.display="none";
}

</script>

</body>
</html>
