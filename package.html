<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assign Package - Alpha Gym</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body{
    font-family:Poppins,sans-serif;
    background:#f4f4f4;
    padding:20px;
}

.container{
    background:white;
    padding:25px;
    max-width:500px;
    margin:auto;
    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

h2{
    text-align:center;
}

select,input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border-radius:8px;
    border:1px solid #ccc;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    background:black;
    color:white;
}

button:hover{
    background:#e63946;
}

.editBtn{
    background:orange;
    margin-top:5px;
}

.back{
    background:gray;
    margin-top:10px;
}

.success{
    color:green;
    text-align:center;
}
</style>
</head>

<body>

<div class="container">

<h2>Assign Package</h2>

<!-- Select Member -->
<select id="memberSelect">
<option value="">Select Member</option>
</select>

<!-- Select Package -->
<select id="packageSelect">
<option value="">Select Package</option>
</select>

<input type="number" id="price" placeholder="Price">
<input type="text" id="duration" placeholder="Duration">

<div class="success" id="success"></div>

<button onclick="assignPackage()">Assign Package</button>

<button class="editBtn" onclick="updatePackage()">Update Package</button>

<button class="back" onclick="goBack()">⬅ Back</button>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs, addDoc, updateDoc, doc } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

// Firebase
const firebaseConfig = {
  apiKey: "AIzaSyAyG9FN8z6XNEXaNIzyO_iPdc8IZUCDENw",
  authDomain: "alpha-4d34a.firebaseapp.com",
  projectId: "alpha-4d34a",
  storageBucket: "alpha-4d34a.firebasestorage.app",
  messagingSenderId: "375125986516",
  appId: "1:375125986516:web:0c9f70b6ede9c1f0b9bf41"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const memberSelect=document.getElementById("memberSelect");
const packageSelect=document.getElementById("packageSelect");

// ✅ Load Members
async function loadMembers(){
    const snap=await getDocs(collection(db,"members"));
    snap.forEach(d=>{
        const m=d.data();
        memberSelect.innerHTML+=`<option value="${d.id}|${m.name}">
        ${m.name}</option>`;
    });
}
loadMembers();

// ✅ Predefined Packages
const defaultPackages=[
{name:"Silver",price:1000,duration:"1 Month"},
{name:"Gold",price:2500,duration:"3 Months"},
{name:"Platinum",price:4500,duration:"6 Months"}
];

// Add to dropdown
defaultPackages.forEach((p,i)=>{
    packageSelect.innerHTML+=
    `<option value="${i}">
        ${p.name} (${p.duration})
    </option>`;
});

// Auto-fill price/duration
packageSelect.addEventListener("change",()=>{
    const p=defaultPackages[packageSelect.value];
    document.getElementById("price").value=p.price;
    document.getElementById("duration").value=p.duration;
});

// ✅ Assign Package
window.assignPackage=async function(){

    const member=memberSelect.value;
    const price=document.getElementById("price").value;
    const duration=document.getElementById("duration").value;
    const success=document.getElementById("success");

    if(!member || !price || !duration){
        alert("Fill all fields");
        return;
    }

    const [memberId,memberName]=member.split("|");
    const pack=defaultPackages[packageSelect.value];

    await addDoc(collection(db,"assignedPackages"),{
        memberId,
        memberName,
        packageName:pack.name,
        price,
        duration,
        assignedDate:new Date().toISOString()
    });

    success.innerText="✅ Package Assigned";
}

// ✅ Update Package (edit predefined)
window.updatePackage=function(){
    const idx=packageSelect.value;
    defaultPackages[idx].price=document.getElementById("price").value;
    defaultPackages[idx].duration=document.getElementById("duration").value;
    alert("Package Updated Locally ✅");
}

window.goBack=function(){
    window.location.href="dashboard.html";
}

</script>

</body>
</html>
