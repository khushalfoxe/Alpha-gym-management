<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diet Plans - Alpha Gym</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

<style>
body{
    font-family:Poppins;
    background:#f4f4f4;
    padding:20px;
}

.container{
    background:white;
    padding:20px;
    max-width:600px;
    margin:auto;
    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

h2{
    text-align:center;
}

select,textarea{
    width:100%;
    padding:12px;
    margin:10px 0;
    border-radius:8px;
    border:1px solid #ccc;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    background:black;
    color:white;
}

button:hover{
    background:#e63946;
}

.card{
    background:#eee;
    padding:12px;
    border-radius:8px;
    margin-top:10px;
}

.delete{
    background:red;
    padding:6px 10px;
    margin-top:5px;
}

.back{
    background:gray;
    margin-top:10px;
}
</style>
</head>

<body>

<div class="container">

<h2>🥗 Diet Plan Management</h2>

<select id="memberSelect">
<option value="">Select Member</option>
</select>

<textarea id="dietText" rows="5"
placeholder="Enter diet plan..."></textarea>

<button onclick="saveDiet()">Save Diet Plan</button>

<h3>Assigned Diet Plans</h3>
<div id="dietList"></div>

<button class="back" onclick="goBack()">⬅ Back</button>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

// Firebase config
const firebaseConfig = {
  apiKey: "AIzaSyAyG9FN8z6XNEXaNIzyO_iPdc8IZUCDENw",
  authDomain: "alpha-4d34a.firebaseapp.com",
  projectId: "alpha-4d34a",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const memberSelect=document.getElementById("memberSelect");
const dietList=document.getElementById("dietList");

// ✅ Load Members
const memSnap = await getDocs(collection(db,"members"));
memSnap.forEach(d=>{
    const m=d.data();
    memberSelect.innerHTML+=
    `<option value="${d.id}|${m.name}">
        ${m.name}
     </option>`;
});

// ✅ Save Diet
window.saveDiet = async function(){

    const member=memberSelect.value;
    const text=document.getElementById("dietText").value;

    if(!member || !text){
        alert("Fill all fields");
        return;
    }

    const [memberId,memberName]=member.split("|");

    await addDoc(collection(db,"dietPlans"),{
        memberId,
        memberName,
        dietText:text,
        createdAt:new Date()
    });

    alert("Diet Plan Saved ✅");
    document.getElementById("dietText").value="";
    loadDiets();
}

// ✅ Load Diet Plans
async function loadDiets(){

    dietList.innerHTML="";

    const snap = await getDocs(collection(db,"dietPlans"));

    snap.forEach(d=>{
        const dp=d.data();

        dietList.innerHTML+=`
        <div class="card">
            <b>${dp.memberName}</b><br>
            ${dp.dietText}
            <button class="delete"
            onclick="remove('${d.id}')">Delete</button>
        </div>`;
    });
}

loadDiets();

// ✅ Delete
window.remove = async function(id){
    await deleteDoc(doc(db,"dietPlans",id));
    loadDiets();
}

window.goBack=()=>window.location.href="dashboard.html";

</script>

</body>
</html>
