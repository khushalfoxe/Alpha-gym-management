<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Member - Alpha Gym</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Poppins,sans-serif;
}

body{
    background:#f4f4f4;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    background:white;
    padding:30px;
    width:380px;
    border-radius:12px;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

h2{
    text-align:center;
    margin-bottom:15px;
}

input{
    width:100%;
    padding:12px;
    margin:8px 0;
    border-radius:8px;
    border:1px solid #ccc;
}

button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:8px;
    font-size:15px;
    cursor:pointer;
}

.addBtn{
    background:black;
    color:white;
}

.addBtn:hover{
    background:#e63946;
}

.backBtn{
    background:gray;
    color:white;
}

.error{
    color:red;
    font-size:13px;
    min-height:18px;
}

.success{
    color:green;
    font-size:14px;
    min-height:18px;
}

.loading{
    display:none;
    text-align:center;
    margin-top:10px;
    font-weight:600;
    color:#333;
}
</style>
</head>

<body>

<div class="container">

<h2>Add Member</h2>

<input type="text" id="name" placeholder="Full Name">
<input type="email" id="email" placeholder="Email">
<input type="password" id="password" placeholder="Password">
<input type="text" id="phone" placeholder="Phone">
<input type="text" id="plan" placeholder="Plan (Gold/Silver etc)">

<div class="error" id="error"></div>
<div class="success" id="success"></div>

<div class="loading" id="loading">
⏳ Creating Member...
</div>

<button class="addBtn" onclick="addMember()">Create Member</button>

<button class="backBtn" onclick="goBack()">⬅ Back to Dashboard</button>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

// 🔥 YOUR FIREBASE CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyAyG9FN8z6XNEXaNIzyO_iPdc8IZUCDENw",
  authDomain: "alpha-4d34a.firebaseapp.com",
  projectId: "alpha-4d34a",
  storageBucket: "alpha-4d34a.firebasestorage.app",
  messagingSenderId: "375125986516",
  appId: "1:375125986516:web:0c9f70b6ede9c1f0b9bf41"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

window.addMember = async function(){

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const plan = document.getElementById("plan").value.trim();

    const error = document.getElementById("error");
    const success = document.getElementById("success");
    const loading = document.getElementById("loading");

    error.innerText="";
    success.innerText="";

    // ✅ Validation
    if(!name || !email || !password || !phone || !plan){
        error.innerText="All fields required";
        return;
    }

    if(password.length < 6){
        error.innerText="Password must be 6+ characters";
        return;
    }

    try{

        // 🔥 Show loading
        loading.style.display="block";

        // ✅ Create user in Firebase Auth
        const userCred = await createUserWithEmailAndPassword(auth,email,password);
        const uid = userCred.user.uid;

        // ✅ Save member data
        await setDoc(doc(db,"members",uid),{
            name,
            email,
            phone,
            plan,
            role:"member",
            joinDate:new Date().toISOString()
        });

        loading.style.display="none";
        success.innerText="✅ Member Created Successfully";

        // 🔁 Redirect after 2 seconds
        setTimeout(()=>{
            window.location.href="dashboard.html";
        },2000);

    }catch(err){
        loading.style.display="none";
        error.innerText=err.message;
    }
}

window.goBack = function(){
    window.location.href="dashboard.html";
}

</script>

</body>
</html>
