<!DOCTYPE html>
<html>
<head>
<title>Alpha Gym</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;}

body{
    margin:0;
    font-family:Poppins;
    background:linear-gradient(145deg,#eef2ff,#f8fafc);
    color:#111;
}

.header{
    text-align:center;
    padding:18px;
    font-size:20px;
    font-weight:600;
}

.container{
    display:grid;
    gap:16px;
    padding:16px;
}

@media (max-width:600px){
    .container{grid-template-columns:1fr;}
}

@media (min-width:601px){
    .container{
        grid-template-columns:repeat(2,1fr);
        max-width:900px;
        margin:auto;
    }
}

@media (min-width:1024px){
    .container{
        grid-template-columns:repeat(3,1fr);
        max-width:1300px;
    }
}

.card{
    backdrop-filter:blur(20px);
    background:rgba(255,255,255,0.65);
    border-radius:22px;
    padding:16px;
    border:1px solid rgba(255,255,255,0.7);
    box-shadow:0 10px 25px rgba(0,0,0,0.08);
}

.card h3{margin-bottom:12px;}

.item{
    background:rgba(255,255,255,0.75);
    padding:10px;
    border-radius:12px;
    margin:8px 0;
    font-size:14px;
}

.bill{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.payBtn{
    background:#007aff;
    border:none;
    color:white;
    padding:6px 14px;
    border-radius:12px;
    cursor:pointer;
}

.dock{
    position:fixed;
    bottom:12px;
    left:50%;
    transform:translateX(-50%);
    backdrop-filter:blur(20px);
    background:rgba(255,255,255,0.6);
    padding:10px 20px;
    border-radius:30px;
    display:flex;
    gap:22px;
}

.dock button{
    border:none;
    background:none;
    font-size:20px;
    cursor:pointer;
}

@media (min-width:900px){
    .dock{display:none;}
}
</style>
</head>

<body>

<div class="header">🏋️ Alpha Gym</div>

<div class="container">

<div class="card">
<h3>👤 Profile</h3>
<div id="profileBox"></div>
</div>

<div class="card">
<h3>📦 Membership</h3>
<div id="packageBox"></div>
</div>

<div class="card">
<h3>💵 Bills</h3>
<div id="billsBox"></div>
</div>

<div class="card">
<h3>🔔 Notifications</h3>
<div id="notificationsBox"></div>
</div>

<div class="card">
<h3>🥗 Diet Plan</h3>
<div id="dietBox"></div>
</div>

<div class="card">
<h3>💊 Supplements</h3>
<div id="supplementsBox"></div>
</div>

</div>

<div class="dock">
<button onclick="scrollToTop()">🏠</button>
<button onclick="location.reload()">🔄</button>
<button onclick="logout()">🚪</button>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, signOut, onAuthStateChanged } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, getDoc, collection, query, where, getDocs, onSnapshot, updateDoc } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyAyG9FN8z6XNEXaNIzyO_iPdc8IZUCDENw",
 authDomain:"alpha-4d34a.firebaseapp.com",
 projectId:"alpha-4d34a"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

onAuthStateChanged(auth,async user=>{
if(!user){window.location="member.html";return;}

const uid=user.uid;

/* PROFILE */
const prof=await getDoc(doc(db,"members",uid));
if(prof.exists()){
 const p=prof.data();
 profileBox.innerHTML=`<div class="item">
 <b>${p.name}</b><br>${p.email}<br>📞 ${p.phone}
 </div>`;
}

/* PACKAGE */
packageBox.innerHTML="";
const packSnap=await getDocs(query(
 collection(db,"assignedPackages"),
 where("memberId","==",uid)
));
packSnap.forEach(d=>{
 const pk=d.data();
 packageBox.innerHTML+=`<div class="item">
 ${pk.packageName}<br>₹${pk.price} | ${pk.duration}
 </div>`;
});

/* BILLS */
billsBox.innerHTML="";
const billSnap=await getDocs(query(
 collection(db,"bills"),
 where("memberId","==",uid)
));

billSnap.forEach(d=>{
 const b=d.data();
 billsBox.innerHTML+=`
 <div class="item bill">
 <span>₹${b.amount} - ${b.month}</span>
 ${
  b.status=="paid"
  ? "✔ Paid"
  : `<button class="payBtn" onclick="payBill('${d.id}')">Pay</button>`
 }
 </div>`;
});

/* NOTIFICATIONS */
onSnapshot(query(
 collection(db,"notifications"),
 where("memberId","==",uid)
),snap=>{
 notificationsBox.innerHTML="";
 snap.forEach(d=>{
  notificationsBox.innerHTML+=`
  <div class="item">${d.data().message}</div>`;
 });
});

/* DIET */
dietBox.innerHTML="";
const dietSnap=await getDocs(query(
 collection(db,"dietPlans"),
 where("memberId","==",uid)
));
dietSnap.forEach(d=>{
 dietBox.innerHTML+=`
 <div class="item">${d.data().dietText}</div>`;
});

/* SUPPLEMENTS (No Image Version) */
supplementsBox.innerHTML="";
const suppSnap=await getDocs(collection(db,"supplements"));
suppSnap.forEach(d=>{
 const s=d.data();
 supplementsBox.innerHTML+=`
 <div class="item">
 <b>${s.name}</b><br>
 ₹${s.price}<br>
 <small>${s.description||""}</small>
 </div>`;
});

});

/* PAY BILL */
window.payBill=async(id)=>{
 await updateDoc(doc(db,"bills",id),{
  status:"paid",
  paidAt:new Date()
 });
 alert("Payment Successful ✅");
 location.reload();
}

window.logout=async()=>{
 await signOut(auth);
 window.location="member.html";
}

window.scrollToTop=()=>window.scrollTo({top:0,behavior:"smooth"});

</script>
</body>
</html>
