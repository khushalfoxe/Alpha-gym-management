<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Bill - Alpha Gym</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body{
    font-family:Poppins,sans-serif;
    background:#f4f4f4;
    padding:20px;
}

.container{
    background:white;
    padding:25px;
    max-width:420px;
    margin:auto;
    border-radius:12px;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

h2{text-align:center;}

select,input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border-radius:8px;
    border:1px solid #ccc;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:black;
    color:white;
    cursor:pointer;
}

button:hover{background:#e63946;}

.loading{text-align:center;}
.success{color:green;text-align:center;}
.back{background:gray;margin-top:10px;}

.billCard{
    background:#eee;
    padding:12px;
    margin-top:10px;
    border-radius:8px;
}

.billRow{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.delete{
    background:red;
    padding:6px 10px;
    border:none;
    border-radius:6px;
    color:white;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="container">

<h2>Create Bill</h2>

<select id="memberSelect">
<option value="">Select Member</option>
</select>

<input type="number" id="amount" placeholder="Amount Paid">
<input type="text" id="month" placeholder="Month (Jan 2026)">
<input type="date" id="date">

<div class="loading" id="loading"></div>
<div class="success" id="success"></div>

<button onclick="createBill()">Generate Bill</button>
<button class="back" onclick="goBack()">⬅ Back</button>

<h3>Created Bills</h3>
<div id="billList"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs, addDoc, deleteDoc, doc } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyAyG9FN8z6XNEXaNIzyO_iPdc8IZUCDENw",
 authDomain:"alpha-4d34a.firebaseapp.com",
 projectId:"alpha-4d34a"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

const memberSelect=document.getElementById("memberSelect");
const billList=document.getElementById("billList");

/* Load Members */
async function loadMembers(){
 const snap=await getDocs(collection(db,"members"));
 snap.forEach(d=>{
  const m=d.data();
  memberSelect.innerHTML+=
  `<option value="${d.id}|${m.name}">
   ${m.name}
  </option>`;
 });
}
loadMembers();

/* Load Bills */
async function loadBills(){
 billList.innerHTML="";
 const snap=await getDocs(collection(db,"bills"));

 snap.forEach(d=>{
  const b=d.data();

  billList.innerHTML+=`
  <div class="billCard">
    <div class="billRow">
      <div>
        <b>${b.memberName}</b><br>
        ₹${b.amount} | ${b.month}<br>
        Status: ${b.status}
      </div>

      <button class="delete"
        onclick="deleteBill('${d.id}')">
        Delete
      </button>
    </div>
  </div>`;
 });
}
loadBills();

/* Create Bill */
window.createBill=async()=>{
 const selected=memberSelect.value;
 const amount=Number(amount.value);
 const monthVal=month.value.trim();
 const dateVal=date.value;

 if(!selected||!amount||!monthVal||!dateVal){
  alert("Fill all fields");
  return;
 }

 const [memberId,memberName]=selected.split("|");

 await addDoc(collection(db,"bills"),{
  memberId,
  memberName,
  amount,
  month:monthVal,
  date:dateVal,
  status:"unpaid",
  createdAt:new Date()
 });

 alert("Bill Created ✅");

 memberSelect.value="";
 amount.value="";
 month.value="";
 date.value="";

 loadBills();
}

/* Delete */
window.deleteBill=async(id)=>{
 await deleteDoc(doc(db,"bills",id));
 loadBills();
}

/* Back */
window.goBack=()=>window.location="dashboard.html";

</script>

</body>
</html>
