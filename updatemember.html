<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Update Members - Alpha Gym</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body{
    font-family:Poppins,sans-serif;
    background:#f4f4f4;
    padding:20px;
}

h2{
    text-align:center;
}

table{
    width:100%;
    background:white;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

th,td{
    padding:12px;
    text-align:center;
    border-bottom:1px solid #ddd;
}

input{
    padding:6px;
    width:95%;
}

button{
    padding:8px 12px;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

.save{
    background:green;
    color:white;
}

.delete{
    background:red;
    color:white;
}

.reset{
    background:orange;
    color:white;
}

.back{
    background:black;
    color:white;
    margin-bottom:15px;
}
</style>
</head>

<body>

<h2>Manage Members</h2>

<button class="back" onclick="goBack()">⬅ Back to Dashboard</button>

<table>
<thead>
<tr>
<th>Name</th>
<th>Email</th>
<th>Phone</th>
<th>Plan</th>
<th>Save</th>
<th>Reset Password</th>
<th>Delete</th>
</tr>
</thead>

<tbody id="memberTable"></tbody>
</table>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs, doc, updateDoc, deleteDoc } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getAuth, sendPasswordResetEmail } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

// 🔥 Firebase Config
const firebaseConfig = {
  apiKey: "AIzaSyAyG9FN8z6XNEXaNIzyO_iPdc8IZUCDENw",
  authDomain: "alpha-4d34a.firebaseapp.com",
  projectId: "alpha-4d34a",
  storageBucket: "alpha-4d34a.firebasestorage.app",
  messagingSenderId: "375125986516",
  appId: "1:375125986516:web:0c9f70b6ede9c1f0b9bf41"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const table = document.getElementById("memberTable");

// ✅ Load Members
async function loadMembers(){

    const querySnapshot = await getDocs(collection(db,"members"));

    table.innerHTML="";

    querySnapshot.forEach(docSnap=>{
        const data = docSnap.data();
        const id = docSnap.id;

        table.innerHTML += `
        <tr>
        <td><input value="${data.name}" id="name-${id}"></td>
        <td><input value="${data.email}" id="email-${id}"></td>
        <td><input value="${data.phone}" id="phone-${id}"></td>
        <td><input value="${data.plan}" id="plan-${id}"></td>

        <td><button class="save" onclick="save('${id}')">Save</button></td>
        <td><button class="reset" onclick="resetPass('${data.email}')">Reset</button></td>
        <td><button class="delete" onclick="remove('${id}')">Delete</button></td>
        </tr>
        `;
    });
}

loadMembers();

// ✅ Update Member
window.save = async function(id){

    const name=document.getElementById(`name-${id}`).value;
    const email=document.getElementById(`email-${id}`).value;
    const phone=document.getElementById(`phone-${id}`).value;
    const plan=document.getElementById(`plan-${id}`).value;

    await updateDoc(doc(db,"members",id),{
        name,email,phone,plan
    });

    alert("Updated ✅");
}

// ✅ Delete Member
window.remove = async function(id){

    if(confirm("Delete member?")){
        await deleteDoc(doc(db,"members",id));
        loadMembers();
    }
}

// ✅ Password Reset
window.resetPass = async function(email){
    await sendPasswordResetEmail(auth,email);
    alert("Password reset email sent 📧");
}

// Back
window.goBack = function(){
    window.location.href="dashboard.html";
}

</script>

</body>
</html>
